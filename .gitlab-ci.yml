stages:
  - prepare
  - lint
  - build
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

include:
  # Prepare
  - project: 'intern/runner-templates'
    ref: "18.1"
    file: '/npm/install-js-dependencies.yml'

  # Lint
  - project: 'intern/runner-templates'
    ref: "18.1"
    file: '/ts/tslint.yml'

  # Build
  - project: 'intern/runner-templates'
    ref: "18.1"
    file: '/npm/build-prod.yml'

  # Publish
  - project: 'intern/runner-templates'
    ref: '18.1'
    file: '/npm/publish.yml'

install-js-dependencies:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_NAME == "main"
      when: never
    - when: on_success

ts-analysis:
  except:
    - schedules
    - tags
    - main

build-assets:
  needs:
    - install-js-dependencies
  artifacts:
    when: on_failure
    untracked: true
  except:
    - schedules
    - tags
    - main

publish-pkg:
  environment:
    name: Verdaccio
    url: https://npm.drenso.dev/-/web/detail/@drenso/vue-frontend-shared
